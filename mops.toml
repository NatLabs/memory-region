[package]
name = "memory-region"
version = "1.4.0"
description = "An abstraction over the Region type that supports reusing deallocated memory."
repository = "https://github.com/NatLabs/memory-region"
keywords = ["region", "memory", "bytes", "deallocate", "collections"]

[dependencies]
'base@0.14.13' = "0.14.13"
'itertools@0.2.2' = "0.2.2"
'stableheapbtreemap@1.5.0' = "1.5.0"
'map@9.0.1' = "9.0.1"
'augmented-btrees@0.9.0' = "0.9.0"

[dev-dependencies]
test = "2.1.1"
fuzz = "1.0.0"
bench = "1.0.0"

[toolchain]
wasmtime = "14.0.4"
moc = "0.14.13"
